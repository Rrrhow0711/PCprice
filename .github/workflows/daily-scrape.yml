name: Daily SSD scrape

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      reset_retailer_data:
        description: "Delete existing data for each retailer before scraping"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        retailer: [coolpc, sinya]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          RESET_FLAG=""
          if [ "${{ github.event.inputs.reset_retailer_data }}" = "true" ]; then
            RESET_FLAG="--reset-retailer-data"
          fi
          timeout 8m python -u -m scraper.main --retailer ${{ matrix.retailer }} $RESET_FLAG
